<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frozen battle evaluation</title>
<style>body{margin:24px;background:#101827;color:#e5edf8;font:15px/1.5 system-ui}main{max-width:1320px;margin:auto}h1{font-size:27px}h2{font-size:19px}a{color:#99c8ff}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}select,input,button{padding:9px;background:#26354e;color:inherit;border:1px solid #64758f;border-radius:6px}input[type=range]{width:min(650px,80vw)}article,.panel,.slot{padding:16px;background:#1c293e;border-radius:9px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.slot{border-top:3px solid #789fe9;min-width:0;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}img{display:block;max-width:100%;max-height:430px;margin:10px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #43516b}.muted{color:#b6c5db}.bad{color:#fca5a5}.match{color:#a7f3d0}.inconclusive{color:#fde68a}</style>
<main><h1 id="title"></h1><p class="muted">Frozen first-pass predictions · independent review shown separately · offline saved evidence</p><div class="panel" id="summary"></div><nav><select id="mode"><option value="timeline">Four-slot timeline</option><option value="events">Chronological events and changes</option><option value="transitions">Send-out / withdrawal / faint / replacement</option><option value="identities">Trainers, rosters and nickname evidence</option><option value="checkpoints">Command-phase comparisons</option><option value="detections">Command detections and exclusions</option><option value="deferred">Deferred observations</option><option value="frames">Original screenshots</option><option value="review">Review, resources and limitations</option></select><select id="side"><option value="">Both sides</option><option>self</option><option>opponent</option></select><select id="status"><option value="">All application statuses</option><option>applied_candidate</option><option>recorded_observation</option><option>applied_partial</option><option>deferred</option><option>rejected</option></select><input id="search" aria-label="Search original evidence" placeholder="Search text / event ID / reason"></nav><section id="timebox" class="panel"><label>Video time <output id="clock"></output></label><br><input id="time" type="range" min="0" step="0.5" value="0"><div id="slots" class="grid"></div></section><p id="count"></p><section id="content"></section><button id="more">Show 40 more</button></main>
<script>const DATA=__DATA__;
const $=id=>document.getElementById(id),esc=s=>String(s??'unknown').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pretty=x=>esc(JSON.stringify(x,null,2));let limit=40;
function pic(r){return r.image?`<a href="${esc(r.image)}" target="_blank" rel="noopener"><img src="${esc(r.image)}" loading="lazy" alt="Original saved evidence at ${esc(r.timestamp)} seconds"></a><small>${esc(r.source_id)} · ${esc(r.sha256)}</small>`:''}
function raw(x,label='Original evidence and provenance'){return `<details><summary>${esc(label)}</summary><pre>${pretty(x)}</pre></details>`}
function event(e){return `<article><h2>${Number(e.timestamp).toFixed(3)}s · ${esc(e.kind)} · ${esc(e.side)}</h2><p class="${e.status==='deferred'||e.status==='rejected'?'bad':''}">${esc(e.status)}${e.reason?' · '+esc(e.reason):''}</p><pre>${esc(e.text)}</pre>${e.images.map(pic).join('')}${Object.keys(e.changes).length?raw(e.changes,'Four-slot state changes'):''}${raw(e)}</article>`}
function frame(f){return `<article><h2>${Number(f.timestamp).toFixed(3)}s · ${esc(f.inspection?.reason||f.ui.phase)}</h2><p>${f.checkpoint?'Scheduled '+esc(f.checkpoint.window_mode||'stable_pair'):'No checkpoint at this frame'}</p>${pic(f)}${raw(f)}</article>`}
function showSlots(){let t=Number($('time').value),r=DATA.timeline[0];for(let s of DATA.timeline){if(s.timestamp>t)break;r=s}$('clock').textContent=t.toFixed(1)+'s';$('slots').innerHTML=Object.entries(r.slots).map(([key,p])=>`<div class="slot"><strong>${esc(key)}</strong><h2>${esc(p.name||p.species_id||p.status)}</h2><p>${esc(p.instance_id)}</p><small>Numeric HP ${esc(p.hp_current)} / ${esc(p.hp_maximum)} · ${esc(p.persistent_identity_status)}</small>${raw(p,'Current prefix facts')}</div>`).join('')}
function render(){const mode=$('mode').value,q=$('search').value.toLowerCase(),side=$('side').value,status=$('status').value;$('timebox').hidden=mode!=='timeline';let items=[];
if(mode==='review')items=[...DATA.review.findings,{review_categories:DATA.review.categories,resources:DATA.performance,consistency:DATA.consistency,provenance:DATA.provenance}];
else if(mode==='identities')items=[{trainers:DATA.identities.trainers},...DATA.identities.preview_rows.map(x=>({preview_row:x})),{nickname_ledger:DATA.identities.ledger},{active_episodes:DATA.identities.episodes}];
else if(mode==='frames')items=DATA.frames;
else if(mode==='detections')items=DATA.frames.filter(f=>f.inspection);
else if(mode==='timeline')items=DATA.events.filter(e=>Object.keys(e.changes).length);
else items=DATA.events.filter(e=>mode==='transitions'?['send_out','switch_out','faint','position_change'].includes(e.kind):mode==='checkpoints'?e.kind==='command_checkpoint':mode==='deferred'?e.status==='deferred'||e.status==='rejected':true);
items=items.filter(r=>(!side||!r.side||r.side===side)&&(!status||!r.status||r.status===status)&&JSON.stringify(r).toLowerCase().includes(q));$('count').textContent=`${items.length} results · showing ${Math.min(limit,items.length)}`;$('content').innerHTML=items.slice(0,limit).map(r=>r.event_id?event(r):r.image?frame(r):r.description?`<article><h2 class="bad">${esc(r.severity)} · ${esc(r.id)}</h2><p>${esc(r.description)}</p><p>${esc(r.diagnosis)}</p>${(r.evidence||[]).map(pic).join('')}${raw(r,'Review provenance')}</article>`:`<article>${raw(r,'Original identity / review evidence')}<pre>${pretty(r.trainers||r.preview_row?{trainers:r.trainers,preview_row:r.preview_row}:r.nickname_ledger?{alias_observations:r.nickname_ledger.aliases?.length}:r.active_episodes?{active_episode_count:r.active_episodes.length}:r)}</pre></article>`).join('')||'<p>No matching records. Absence is not proof of coverage or correctness.</p>';$('more').hidden=limit>=items.length;showSlots();}
$('title').textContent=DATA.battle_id+' — production evaluation';$('summary').textContent=`${DATA.frames.length} saved frames; ${DATA.counts.events} event records; ${DATA.counts.checkpoints} command checkpoints; ${DATA.counts.corrections} corrections. Review: ${DATA.review.status}. Automatic candidates are not independently confirmed facts.`;$('time').max=Math.ceil(Math.max(...DATA.frames.map(f=>f.timestamp)));$('time').oninput=showSlots;
for(let id of ['mode','side','status','search'])$(id).addEventListener(id==='search'?'input':'change',()=>{limit=40;render()});$('more').onclick=()=>{limit+=40;render()};render();
</script></html>
