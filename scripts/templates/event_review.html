<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>M2.3.8 live video / Battle Log review</title>
<style>body{font:15px system-ui;margin:24px;background:#f3f5f8;color:#192335}button,input,select,textarea{font:inherit;margin:4px;padding:6px}article{background:white;border:1px solid #ccd4df;border-radius:8px;padding:14px;margin:12px 0}img{max-width:100%;max-height:450px}pre{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:95%}.tag{color:#516781}nav{position:sticky;top:0;background:#f3f5f8;padding:8px}table{width:100%;table-layout:fixed}td,th{text-align:left;vertical-align:top;white-space:pre-wrap;padding:8px}details{margin:8px}</style>
<h1>Live video → Battle Log comparison</h1><p>机器结果均待核验。历史日志仅覆盖实际可见页面；无日志覆盖的预测不计为错误。COMMAND 周期不是确认回合。</p>
<pre id="summary"></pre><nav><select id="mode"><option value="comparison">Battle Log 对照</option><option value="frames">逐帧调度 / 证据</option><option value="events">视频事件 / 状态接纳</option><option value="monitor">2 FPS 监测（含跳过帧）</option><option value="teams">队伍采集 / 来源</option><option value="rawlog">历史日志原始页 / 未拼接行</option></select><select id="filter"><option value="">全部状态</option></select><button id="export">导出审核标注</button><label>导入标注<input id="import" type="file" accept="application/json"></label></nav>
<div id="content"></div><button id="more">显示更多</button>
<script>const DATA=__DATA__;
const key='m238-review:'+DATA.prediction.battle_id+':'+DATA.prediction_sha256;let notes={};try{notes=JSON.parse(localStorage.getItem(key)||'{}')}catch{}let limit=30;
const el=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}, root=document.querySelector('#content');
document.querySelector('#summary').textContent=JSON.stringify({prediction:DATA.summary,reference:DATA.comparison?.summary||'尚未执行独立日志提取',assembly_issues:DATA.reference?.assembly_issues||[]},null,2);
const statuses=[...new Set((DATA.comparison?.comparisons||[]).map(r=>r.status))];for(const s of statuses){const o=el('option',s);o.value=s;document.querySelector('#filter').append(o)}
function evidence(parent,frame,label){if(!frame)return;const d=el('details');d.append(el('summary',label+' '+frame.timestamp+'s'));const a=el('a');a.href=frame.image;a.target='_blank';const im=el('img');im.src=frame.image;im.loading='lazy';a.append(im);d.append(a);parent.append(d)}
function annotation(parent,id){const label=el('label','审核结论：');const select=el('select');for(const s of ['unreviewed','verified_match','verified_mismatch','unresolved']){const o=el('option',s);o.value=s;select.append(o)}select.value=notes[id]?.status||'unreviewed';const area=el('textarea');area.placeholder='备注 / 差异原因（不修改程序预测）';area.value=notes[id]?.note||'';const save=()=>{notes[id]={status:select.value,note:area.value};localStorage.setItem(key,JSON.stringify(notes))};select.onchange=save;area.oninput=save;label.append(select);parent.append(label,area)}
function render(){root.replaceChildren();const mode=document.querySelector('#mode').value,filter=document.querySelector('#filter').value;let rows=mode==='frames'?DATA.frames:mode==='events'?DATA.prediction.receipts:mode==='monitor'?DATA.monitoring:mode==='teams'?DATA.prediction.teams:mode==='rawlog'?(DATA.reference?.views||[]):(DATA.comparison?.comparisons||[]).filter(r=>!filter||r.status===filter);if(!rows.length)root.append(el('p','尚无可显示的记录。Pass A 必须先冻结，之后才可独立提取日志。'));for(const r of rows.slice(0,limit)){const a=el('article');if(mode==='comparison'){a.append(el('b',r.status+' · 回合 '+(r.turn??'未知')));const t=el('table');const tr=el('tr');for(const [title,text]of [['游戏 Battle Log',r.log_text],['对应视频事件',r.prediction?.original_text||'未找到'],['原因',r.reason]]){const td=el('td');td.append(el('strong',title),el('pre',text));tr.append(td)}t.append(tr);a.append(t,el('pre',JSON.stringify({actor:r.prediction?.actor,target:r.prediction?.target,uncertainty:r.uncertainty},null,2)));const f=DATA.frames.find(f=>f.source_id===r.prediction?.evidence?.[0]?.source_id);evidence(a,f,'原始实时视频证据');for(const f of r.log_frames||[])evidence(a,f,'日志检视画面（不是事件时间）');annotation(a,r.log_entry_id)}else if(mode==='rawlog'){a.append(el('b','日志检视 '+r.timestamp+'s · 游戏回合 '+(r.turn??'未知')+' · scroll '+r.geometry?.scroll_top));evidence(a,DATA.frames.find(f=>f.source_id===r.source_id),'日志页面');for(const row of r.observations){const used=DATA.reference.entries.some(e=>e.observation_ids.includes(row.observation_id));a.append(el('b',used?'已拼接的重复观察':'历史行未可靠拼接 / 顺序待定'),el('pre',row.raw_text));annotation(a,row.observation_id)}a.append(el('pre',JSON.stringify({header:r.header_ocr,geometry:r.geometry,original_event_time:r.original_event_time},null,2)))}else if(mode==='teams'){a.append(el('b',r.side+' · row '+r.preview_row+' · '+r.status));a.append(el('pre',JSON.stringify(r,null,2)))}else if(mode==='monitor'){a.append(el('b',r.timestamp+'s · '+(r.inspected?'进入区域调度':'跳过昂贵识别')));a.append(el('pre',JSON.stringify(r,null,2)))}else if(mode==='frames'){a.append(el('b',r.timestamp+'s · '+r.inspection_fps+' FPS'));evidence(a,r,'原始画面');a.append(el('pre',JSON.stringify({command:r.command,message:r.message,decisions:r.decisions,visual:r.visual,snapshot:r.snapshot,regions:r.regions},null,2)))}else{a.append(el('b',r.kind+' · '+r.timestamp+'s'));a.append(el('pre',JSON.stringify(r,null,2)));const f=DATA.frames.find(f=>f.source_id===r.source_id);evidence(a,f,'实时事件证据')}root.append(a)}document.querySelector('#more').hidden=limit>=rows.length}
document.querySelector('#more').onclick=()=>{limit+=30;render()};for(const id of ['mode','filter'])document.querySelector('#'+id).onchange=()=>{limit=30;render()};
document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify({schema:'m238-human-review-v1',battle_id:DATA.prediction.battle_id,prediction_sha256:DATA.prediction_sha256,annotations:notes},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='m238-human-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.querySelector('#import').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.schema!=='m238-human-review-v1'||d.battle_id!==DATA.prediction.battle_id||d.prediction_sha256!==DATA.prediction_sha256)throw Error('标注不属于本次预测');notes={...notes,...d.annotations};localStorage.setItem(key,JSON.stringify(notes));render()}catch(err){alert(err.message)}};render();</script></html>
