<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M2.3.8-S · Saved-message semantic repair</title>
<style>body{font:15px system-ui;margin:24px;background:#f4f6f9;color:#17263a}h1{font-size:25px}nav{position:sticky;top:0;background:#fff;padding:12px;display:flex;gap:12px;flex-wrap:wrap;border:1px solid #ccd5df}select,input{font:inherit;padding:7px}article,details.panel{background:#fff;padding:16px;margin:12px 0;border:1px solid #d3dce7;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}table{border-collapse:collapse;width:100%;background:#fff}td,th{padding:10px;border:1px solid #d6deea;text-align:left;vertical-align:top}td{min-width:170px}small{color:#52657d}.scroll{overflow-x:auto}.badge{padding:3px 8px;border-radius:4px;background:#e5eef9;margin:4px;display:inline-block}.deferred,.rejected{background:#ffe4d9}img{max-width:100%;max-height:500px}a{color:#065ca8}button{padding:10px;margin:12px}</style>
<h1>M2.3.8-S · Battle 6 消息复原与语义修复</h1>
<p>仅回放保存的观测。候选状态更新、直接观测与人工验证不同；旧预测及 viewer 保持不变。图片复用原始证据，无外部网络依赖。</p>
<p><a href="__TITLE__.md">Markdown 报告</a> · <a href="__TITLE__.json">完整 JSON</a></p>
<details class="panel"><summary>计数、测试与边界</summary><pre id="counts"></pre><ul id="limits"></ul></details>
<nav><select id="mode"><option value="cases">指定时间：修复前后</option><option value="timeline">完整语义事件时间线</option><option value="remaining">逐帧消息分类 / 未解决</option><option value="causes">原因与局部修正</option></select><select id="filter"><option value="">全部状态</option value="deferred">deferred</option><option value="rejected">rejected</option><option value="applied_partial">部分入场</option><option value="recorded_observation">仅记录观察</option><option value="unresolved">剩余缺口</option><option value="duplicate">重复 / 支持读数</option></select><input id="search" placeholder="时间、文本、对象、阵营、原因"><span id="count"></span></nav>
<main id="content"></main><button id="more">显示更多</button>
<script>
const DATA=__DATA__;
const $=id=>document.getElementById(id),E=(tag,text)=>{let e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e},J=v=>JSON.stringify(v,null,2),F=t=>Number(t).toFixed(3);
$('counts').textContent=J({counts:DATA.counts,tests:DATA.tests,preservation:DATA.preservation,first_slots:DATA.first_slots,binding_validation:DATA.binding_validation,replay_reused_from:DATA.replay_reused_from});for(let t of DATA.limitations)$('limits').append(E('li',t));
let limit=40;
function detail(parent,title,data){let d=E('details');d.append(E('summary',title),E('pre',J(data)));parent.append(d)}
function evidence(parent,proofs){let seen=new Set;for(let p of proofs||[]){let image=p.image||p.details?.image;if(!image)continue;let href=image.startsWith('.cache/')?'../'+image:image;if(seen.has(href))continue;seen.add(href);let d=E('details'),s=E('summary'),a=E('a','证据 '+F(p.timestamp??p.details?.timestamp)+'s');a.href=href;a.target='_blank';a.rel='noopener';s.append(a);d.append(s);d.addEventListener('toggle',()=>{if(d.open&&!d.querySelector('img')){let im=E('img');im.src=href;im.loading='lazy';im.alt=a.textContent;d.append(im)}});parent.append(d)}}
function badge(parent,text){let e=E('span',text);e.className='badge '+text;parent.append(e)}
function events(parent,rows){for(let r of rows){let d=E('div');d.append(E('b',F(r.timestamp)+'s · '+r.kind+' · '+r.side+' · '+(r.actor?.name||r.target?.name||'对象未知')));badge(d,r.receipt);if(r.reason)d.append(E('p',r.reason));detail(d,'逻辑消息、绑定、目标与入场依据',r);parent.append(d)}}
function matches(r,q,filter){if(q&&!J(r).toLowerCase().includes(q))return false;if(!filter)return true;if(filter==='unresolved')return r.remaining?.length||r.receipt==='deferred'||r.receipt==='rejected'||/missing|identity|unsupported|fragment|failure|rejection|error|visibility/.test(r.category||'');if(filter==='duplicate')return /duplicate/.test(r.category||'');return r.receipt===filter||[...(r.before||[]),...(r.after||[])].some(x=>x.receipt===filter)}
function render(){let root=$('content');root.replaceChildren();let mode=$('mode').value,q=$('search').value.toLowerCase(),filter=$('filter').value;let rows=mode==='cases'?DATA.cases:mode==='timeline'?DATA.timeline:mode==='remaining'?DATA.remaining_message_observations:Object.entries(DATA.causal_paths).map(([cause,explanation])=>({cause,explanation}));rows=rows.filter(r=>matches(r,q,filter));$('count').textContent=rows.length+' 条';$('more').hidden=rows.length<=limit;for(let r of rows.slice(0,limit)){let a=E('article');if(mode==='cases'){a.append(E('h2',F(r.start)+'–'+F(r.end)+'s · '+r.label));badge(a,r.assessment);let wrap=E('div');wrap.className='scroll';let table=E('table'),tr=E('tr');for(let h of ['保存的原始观察','修复前','本轮回放'])tr.append(E('th',h));table.append(tr);tr=E('tr');for(let key of ['readings','before','after']){let td=E('td');if(key==='readings'){for(let v of r.readings){td.append(E('pre',F(v.timestamp)+'s\n'+v.raw));detail(td,'逐行读数 / 横幅 OCR',v)}evidence(td,r.readings)}else events(td,r[key]);tr.append(td)}table.append(tr);wrap.append(table);a.append(wrap);if(r.remaining.length)detail(a,'仍未解决',r.remaining)}else if(mode==='timeline'){events(a,[r]);a.append(E('pre',r.logical_message));evidence(a,r.evidence)}else if(mode==='remaining'){a.append(E('b',F(r.timestamp)+'s · '+r.category),E('pre',r.raw));detail(a,'分类依据',r);evidence(a,[r])}else a.append(E('h2',r.cause),E('p',r.explanation));root.append(a)}}
for(let id of ['mode','filter'])$(id).addEventListener('change',()=>{limit=40;render()});$('search').addEventListener('input',()=>{limit=40;render()});$('more').onclick=()=>{limit+=40;render()};render();
</script></html>
