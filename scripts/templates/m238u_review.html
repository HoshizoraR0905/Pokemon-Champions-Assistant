<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M2.3.8-U · Active slot persistence</title>
<style>body{font:15px system-ui;background:#f3f6fa;color:#17283a;margin:24px}h1{font-size:25px}nav{position:sticky;top:0;background:#fff;z-index:2;padding:12px;display:flex;gap:12px;flex-wrap:wrap}select,input,button{font:inherit;padding:6px}article,.panel{background:white;border:1px solid #cbd5e2;border-radius:6px;padding:16px;margin:12px 0}table{border-collapse:collapse;width:100%;background:white}th,td{border:1px solid #ccd6e2;text-align:left;vertical-align:top;padding:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.scroll{overflow-x:auto}.cards{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:10px}.card{padding:12px;overflow-wrap:anywhere}.supported_active{background:#9dddbd}.vacant{background:#accbed}.unknown{background:#dce2e9}.last_known_identity_current_evidence_unresolved{background:#f7c18e}.bar{height:28px;min-width:550px;position:relative;background:#dce2e9;margin:12px 0}.segment{position:absolute;height:28px;border:1px solid white;min-width:1px;cursor:pointer;padding:0}img{max-width:100%;max-height:500px}a{color:#075ab0}input[type=range]{width:100%}@media(max-width:950px){.cards{grid-template-columns:repeat(2,minmax(150px,1fr))}}</style>
<h1>M2.3.8-U · 活动槽位持续性对照</h1>
<p>绿色表示既有证据支持的活动占位持续成立，不表示当前 HUD 已读清。橙色只表示尚未解除的连续性不确定。蓝色为有证据的空位，灰色为未知。缺少 HUD 不等于缺少活动 Pokémon。</p>
<p>同一份 Battle 6 保存事件，基线为 T v2；不使用未来 HUD 回填。未运行识别；未补造模型证据。<a href="__TITLE__.md">报告</a> · <a href="__TITLE__.json">JSON</a></p>
<details class="panel"><summary>核实计数、验证及边界</summary><pre id="summary"></pre><ul id="limits"></ul></details>
<nav><select id="mode"><option value="slots">四槽位对照</option><option value="triggers">55 段橙色起点</option><option value="changes">回执变化</option><option value="visibility">HUD 可见性（缓存判断）</option><option value="episodes">入场与离场证据</option></select><select id="version"><option value="after">U 持续性策略</option><option value="before">T v2 冻结时间线</option></select><select id="filter"><option value="">全部</option><option value="self">我方</option><option value="opponent">对方</option><option value="unresolved">未解决 / 橙色</option></select><input id="search" placeholder="时间、对象、原因、原始文本"><span id="count"></span></nav>
<main id="content"></main><button id="more">显示更多</button>
<script>
const DATA=__DATA__,SLOTS=['self:left','self:right','opponent:left','opponent:right'];let limit=60;
const $=id=>document.getElementById(id),E=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e},J=x=>JSON.stringify(x,null,2),F=x=>Number(x).toFixed(3);
$('summary').textContent=J({counts:DATA.counts,validation:DATA.validation,tests:DATA.tests,protected_files:DATA.protected_files});for(let s of DATA.limits)$('limits').append(E('li',s));
function details(p,label,obj){let d=E('details');d.append(E('summary',label),E('pre',J(obj)));p.append(d)}
function proofs(p,rows){let seen=new Set;for(let r of rows||[]){let image=r.image||r.details?.image;if(!image)continue;let href=image.startsWith('.cache/')?'../../../'+image:image;if(seen.has(href))continue;seen.add(href);let d=E('details'),s=E('summary'),a=E('a','原始证据 '+F(r.timestamp??r.details?.timestamp)+'s');a.href=href;a.target='_blank';a.rel='noopener';s.append(a);d.append(s);d.ontoggle=()=>{if(d.open&&!d.querySelector('img')){let im=E('img');im.src=href;im.alt='保存的证据';d.append(im)}};p.append(d)}}
function intervalProofs(r){return [...(DATA.event_evidence[r.event_id]||[]),...(r.evidence||[]).flatMap(p=>p.sources||[])];}
function table(headers,rows){let w=E('div');w.className='scroll';let t=E('table'),tr=E('tr');for(let s of headers)tr.append(E('th',s));t.append(tr);for(let row of rows){tr=E('tr');for(let v of row){let td=E('td');v instanceof Node?td.append(v):td.textContent=v??'未知';tr.append(td)}t.append(tr)}w.append(t);return w}
function accept(r,key=''){let f=$('filter').value,q=$('search').value.toLowerCase();if(q&&!J(r).toLowerCase().includes(q))return false;if(f==='unresolved')return /unresolved|uncertain|conflict/.test(r.status||r.after_status||'')||r.after?.receipt==='deferred';return !f||(key||r.slot||r.side||r.after?.side||'').startsWith(f)}
function slots(root){let timeline=$('version').value==='before'?DATA.before_timeline:DATA.timeline,end=Math.max(...SLOTS.flatMap(k=>timeline[k].map(r=>r.end)));let panel=E('article'),label=E('b'),slider=E('input'),cards=E('div');cards.id='slot-cards';cards.className='cards';slider.id='time';slider.type='range';slider.min=0;slider.max=end;slider.step=.001;slider.value=519.52;panel.append(label,slider,cards);root.append(panel);
 function snapshot(){let t=Number(slider.value);label.textContent='原视频 '+F(t)+'s';cards.replaceChildren();for(let key of SLOTS){let r=[...timeline[key]].reverse().find(r=>r.start<=t&&t<=r.end)||{status:'unknown'},c=E('div');c.className='card '+r.status;c.dataset.slot=key;c.append(E('b',key),E('h3',r.name||r.status),E('p',r.status));let v=[...DATA.visibility].reverse().find(v=>v.slot===key&&v.timestamp<=t);if(v)c.append(E('p','独立 HUD 状态：'+v.status));details(c,'实例 / episode / 占位证据',r);proofs(c,intervalProofs(r));cards.append(c)}}slider.oninput=snapshot;snapshot();let total=0;
 for(let key of SLOTS){root.append(E('h2',key));let bar=E('div');bar.className='bar';for(let r of timeline[key]){if(r.end<=r.start)continue;let b=E('button');b.className='segment '+r.status;b.style.left=(100*r.start/end)+'%';b.style.width=(100*(r.end-r.start)/end)+'%';b.title=F(r.start)+'–'+F(r.end)+'s '+(r.name||r.status);b.onclick=()=>{slider.value=r.start+.001;snapshot();panel.scrollIntoView()};bar.append(b)}let w=E('div');w.className='scroll';w.append(bar);root.append(w);let rows=timeline[key].filter(r=>accept(r,key));total+=rows.length;root.append(table(['区间','活动身份 / 连续性','实例 / episode','证据'],rows.map(r=>{let p=E('div');proofs(p,intervalProofs(r));return [F(r.start)+'–'+F(r.end),(r.name||'未知')+'\n'+r.status,(r.instance_id||'未知')+'\n'+(r.episode_id||'未知'),p]})))}$('count').textContent=total+' 个区间';$('more').hidden=true;}
function render(){let root=$('content');root.replaceChildren();let mode=$('mode').value;if(mode==='slots'){slots(root);return}let source=mode==='triggers'?DATA.triggers:mode==='changes'?DATA.changes:mode==='visibility'?DATA.visibility:DATA.active_entry_episodes,rows=source.filter(r=>accept(r));$('count').textContent=rows.length+' 条';$('more').hidden=rows.length<=limit;
 for(let r of rows.slice(0,limit)){let a=E('article');if(mode==='triggers'){a.append(E('h2',r.slot+' · '+F(r.start)+'–'+F(r.end)+'s · '+r.name),E('p','旧 HUD：'+J(r.raw)+'；confidence='+r.confidence+'；'+r.old_policy_reason),E('p','U：'+r.after_status+'；原实例保持='+r.same_instance),E('p',r.policy_path));proofs(a,r.evidence)}else if(mode==='changes'){a.append(E('h2',F(r.timestamp)+'s · '+r.after.kind),E('pre',r.after.raw),E('p',r.before.receipt+' → '+r.after.receipt),E('p','此前原因：'+r.before.reason));proofs(a,r.evidence)}else if(mode==='visibility'){a.append(E('h2',F(r.timestamp)+'s · '+r.slot),E('p',r.status),E('p','缓存可见性判断可能错误；与占位状态分开：'+r.occupancy_status));proofs(a,[r])}else{a.append(E('h2',F(r.start)+'s · '+r.side+' · species '+r.species_id+' · '+r.slot),E('p','持久个体关系：'+r.persistent_identity_status));proofs(a,r.entry_evidence?.sources);if(r.departure)proofs(a,r.departure.evidence?.sources)}details(a,'完整诊断及独立证据',r);root.append(a)}}
for(let id of ['mode','version','filter'])$(id).onchange=()=>{limit=60;render()};$('search').oninput=()=>{limit=60;render()};$('more').onclick=()=>{limit+=60;render()};render();
</script></html>
