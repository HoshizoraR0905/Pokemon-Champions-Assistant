<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>M2.3.8-W command checkpoint review</title>
<style>
body{font:15px system-ui;background:#101827;color:#e4ecf5;margin:24px;line-height:1.5}main{max-width:1250px;margin:auto}h1{font-size:26px}a{color:#93c5fd}button,select,input{padding:9px;background:#25334a;color:inherit;border:1px solid #66768d;border-radius:6px}nav{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}article,.panel{padding:18px;background:#1c293c;border-radius:10px;margin:14px 0}img{max-width:100%;max-height:440px;display:block;margin:12px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #445166}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.match{color:#86efac}.inconclusive{color:#fde68a}.conflict,.unexpected_occupancy{color:#fca5a5}small{color:#bac9dc}
</style><main><h1 id="title"></h1><p>Independent ordinary-command HUD verification • Offline saved evidence • Review pending</p><div class="panel" id="summary"></div><nav><select id="mode"><option value="checkpoints">Checkpoints</option><option value="eligible">Eligible frames</option><option value="excluded">Excluded frames</option><option value="examples">Reference exclusions</option></select><select id="status"><option value="">All outcomes</option><option>match</option><option>inconclusive</option><option>conflict</option><option>unexpected_occupancy</option></select><input id="search" placeholder="Search evidence" aria-label="Search evidence"></nav><p id="count"></p><section id="content"></section><button id="more">Show 40 more</button><details class="panel"><summary>Resource cost and limitations</summary><pre id="cost"></pre></details></main>
<script>const DATA=__DATA__;
const $=id=>document.getElementById(id),esc=s=>String(s??'unknown').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),json=x=>esc(JSON.stringify(x,null,2));let limit=40;
function picture(r){return r.image?`<a href="${esc(r.image)}" target="_blank" rel="noopener"><img src="${esc(r.image)}" loading="lazy" alt="Saved screenshot at ${esc(r.timestamp??'reference')} seconds"></a>`:''}
function receipt(r){return `<article><h2>${r.timestamp.toFixed(3)}s · ${esc(r.phase_id)}</h2><p>${r.corrections} current-slot corrections; historical transitions are not inferred.</p>${picture(r.outcomes[0].observation)}<table><thead><tr><th>HUD slot</th><th>Original OCR / confidence</th><th>Predicted → observed species</th><th>Outcome</th></tr></thead><tbody>${r.outcomes.map(o=>`<tr><td>${esc(o.key)}</td><td>${esc(o.observation.species.raw_text)} / ${esc(o.observation.species.confidence)}</td><td>${esc(o.previous_species_id)} → ${esc(o.observed?.species_id)}</td><td class="${esc(o.status)}">${esc(o.status)}<br><small>${esc(o.basis)}</small></td></tr>`).join('')}</tbody></table>${r.outcomes.map(o=>`<details><summary>${esc(o.key)} — source, icon, identity proof, old/new episode and historical gap</summary><pre>${json(o)}</pre>${(o.historical_gap?.message_and_coverage_evidence||[]).flatMap(e=>e.evidence).filter(p=>p.details?.image).map(p=>`<a href="${esc(p.details.image)}">Saved interval message / coverage screenshot</a>`).join('<br>')}</details>`).join('')}<small>${esc(r.event_id)}</small></article>`}
function frame(r){return `<article><h2>${Number(r.timestamp).toFixed(3)}s · ${esc(r.inspection.reason)}</h2>${picture(r)}<pre>${json(r)}</pre></article>`}
function render(){let mode=$('mode').value,items=mode==='checkpoints'?DATA.receipts:mode==='examples'?DATA.examples:DATA.frames.filter(r=>mode==='eligible'?r.inspection.eligible:!r.inspection.eligible),q=$('search').value.toLowerCase(),status=$('status').value;
items=items.filter(r=>(!status||r.outcomes?.some(o=>o.status===status))&&JSON.stringify(r).toLowerCase().includes(q));$('count').textContent=`${items.length} results · showing ${Math.min(items.length,limit)}`;$('content').innerHTML=items.slice(0,limit).map(r=>mode==='checkpoints'?receipt(r):mode==='examples'?`<article><h2>${esc(r.meaning)} — excluded</h2>${picture(r)}<pre>${json(r)}</pre></article>`:frame(r)).join('')||'<p>No results. Zero stable checkpoints is an unresolved coverage limitation, not successful verification.</p>';$('more').hidden=items.length<=limit;}
$('title').textContent=DATA.battle_id+' — M2.3.8-W';$('summary').textContent=`${DATA.counts.frames} saved frames; ${DATA.counts.eligible_frames} eligible frames; ${DATA.summary.checkpoints} stable attempts. Slot outcomes: ${JSON.stringify(DATA.summary.classification)}. Actual corrections: ${DATA.summary.corrections}. No video decoding or full-battle OCR.`;$('cost').textContent=JSON.stringify({costs:DATA.costs,limitations:DATA.limitations,audit_compatibility:DATA.audit_compatibility},null,2);
for(let id of ['mode','status','search'])$(id).addEventListener(id==='search'?'input':'change',()=>{limit=40;render()});$('more').onclick=()=>{limit+=40;render()};render();
</script></html>
