<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Frozen message identity experiment</title>
<style>body{font:16px system-ui;background:#f4f6fa;color:#18233b;margin:2rem auto;max-width:1100px;padding:0 1rem}article,header{background:white;padding:1.2rem;margin:1rem 0;border:1px solid #d7deeb;border-radius:8px}img{max-width:100%;height:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:inline-block;margin-right:1rem}.match{color:#176837}.inconclusive{color:#9a5a00}summary{cursor:pointer}table{border-collapse:collapse;width:100%}td,th{padding:.5rem;text-align:left;border-bottom:1px solid #ddd}</style>
<header><h1>Message identity experiment — Battle 9</h1><strong id="decision"></strong><p>Predictions are frozen from messages before the independent HUD comparison. Unknown identity, form and slot fields remain unknown. This page uses saved evidence only.</p><p><a href="../m239-message-baseline-review-v1/review.html">Full original four-slot timeline, events and screenshots</a></p><label>Result <select id="filter"><option value="">All entries</option><option>match</option><option>mismatch</option><option>inconclusive</option></select></label><label>Time <input id="time" type="range" min="0" max="444.25" step="0.5" value="444.25"><output id="position"></output></label><p id="count"></p></header>
<main id="entries"></main><article><h2>Performance</h2><pre id="performance"></pre></article><article><h2>Acceptance limits</h2><pre id="limits"></pre></article>
<script>const DATA=__DATA__;
const esc=v=>String(v??'unknown').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const t=Number(document.querySelector('#time').value),f=document.querySelector('#filter').value;document.querySelector('#position').textContent=t.toFixed(1)+'s';const rows=DATA.comparison.rows.filter(r=>r.timestamp<=t&&(!f||r.comparison===f));document.querySelector('#count').textContent=rows.length+' / '+DATA.comparison.rows.length+' entries';document.querySelector('#entries').innerHTML=rows.map(r=>{const h=r.hud,b=DATA.baseline.find(b=>b.episode_id===r.episode_id)||{};return `<article><h2>${r.timestamp.toFixed(3)}s · ${esc(r.side)} / ${esc(r.slot)}</h2><p>${esc(r.literal)} → message species ${esc(r.identity?.species_id)}; form ${esc(r.identity?.canonical_identity)}</p><p class="${esc(r.comparison)}">${esc(r.comparison)} ${h?'— first eligible HUD '+h.timestamp.toFixed(3)+'s, species '+esc(h.identity.species_id):'— no eligible same-slot confirmation'}</p><p>Existing HUD-assisted final episode: species ${esc(b.species_id)}, ${esc(b.side)} / ${esc(b.slot)}; verification at ${esc(b.verified_at)}s. This column cannot repair the frozen prediction.</p><details><summary>Separate message and HUD evidence</summary>${r.message_image?'<p>Original send-out evidence</p><img loading="lazy" src="'+esc(r.message_image)+'">':''}${r.hud_image?'<p>First eligible independent HUD evidence</p><img loading="lazy" src="'+esc(r.hud_image)+'">':''}<pre>${esc(JSON.stringify(r,null,2))}</pre></details></article>`}).join('')}
document.querySelector('#decision').textContent=DATA.review.status;document.querySelector('#performance').textContent=JSON.stringify(DATA.performance,null,2);document.querySelector('#limits').textContent=JSON.stringify(DATA.review,null,2);document.querySelector('#filter').onchange=render;document.querySelector('#time').oninput=render;render();
</script></html>
